[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-analyzer"
version = "0.1.0"
description = "Read-only Ethereum JSON-RPC evidence collection framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "h3ides"}]
dependencies = []

[project.scripts]
eth-analyzer = "eth_analyzer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
